name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositori
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: 📦 Instal·lar dependències
        run: npm install

      - name: 🏗️ Empaquetar web a www/
        run: npm run build

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Inicialitzar plataforma Android amb Capacitor
        run: |
          npx cap add android
          node scripts/prepare-android.js
          npx cap sync android

      - name: 🔨 Compilar APK amb Gradle (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Pujar APK com a Artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: 9T-Beta10-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Crear Release a GitHub (Opcional)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "9T Beta10 APK (Directe)"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
