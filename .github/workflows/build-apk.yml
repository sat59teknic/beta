name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositori
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: 📦 Instal·lar dependències
        run: npm install

      - name: 🧪 Executar tests (0 fallades requerit)
        run: npm test

      - name: 🏗️ Empaquetar web a www/
        run: npm run build

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Inicialitzar plataforma Android amb Capacitor
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          node scripts/prepare-android.js
          node scripts/generate-icons.js
          npx cap sync android

      - name: 🔐 Configurar Keystore permanent
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: 🔨 Compilar APK amb Gradle (Debug)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Preparar APK per a descàrrega
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Beta10-app.apk

      - name: 📤 Pujar APK com a Artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: 9T-Beta10-App
          path: android/app/build/outputs/apk/debug/Beta10-app.apk
          retention-days: 30

      - name: 🚀 Publicar APK a GitHub Releases (Descàrrega directa sense login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "9T Beta10 - APK Actualitzada"
          body: |
            ### 📱 Descàrrega directa de l'APK (Última versió)
            Fes clic a **`Beta10-app.apk`** per instal·lar directament al teu dispositiu Android sense descomprimir i sense necessitat d'iniciar sessió a GitHub.
          files: android/app/build/outputs/apk/debug/Beta10-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
