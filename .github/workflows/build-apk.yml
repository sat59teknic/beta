name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositori
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: 📦 Instal·lar dependències
        run: npm install

      - name: 🏗️ Empaquetar web a www/
        run: npm run build

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Inicialitzar plataforma Android amb Capacitor
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npx cap add android
          node scripts/prepare-android.js
          node scripts/generate-icons.js
          npx cap sync android

      - name: 🔨 Compilar APK amb Gradle (Debug)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Pujar APK com a Artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: 9T-Beta10-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
