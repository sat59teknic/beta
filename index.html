<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>9T Beta10 Control</title>
    
    <!-- PWA / Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beta10 Control">
    <meta name="theme-color" content="#e74c3c">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <link rel="icon" href="icon-192.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">

    <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="sql-wasm.js"></script>
    <script src="db.js"></script>
    <script src="db-ui.js"></script>
    <script src="beta10-direct.js"></script>
    <script src="auth.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div id="connection-status" class="status-indicator" title="Estat de la connexió"></div>
            <h1>
                <span class="logo-text">
                    <span class="nine-text">9</span><span class="t-text">T</span>
                </span>
                Beta10
                <span class="version-badge">v2.0</span>
            </h1>
            <div id="gps-status" class="status-indicator" title="Estat del GPS"></div>
        </header>

        <main class="main-content">
            <div class="status-card" id="status-card">
                <div class="status-card-header">
                    <span class="status-card-label">Estat Actual</span>
                    <span class="status-live-badge" id="status-live-badge">
                        <span class="status-live-dot"></span>
                        <span class="status-live-text">ACTIU</span>
                    </span>
                </div>
                <h2 id="current-state-text">--</h2>
            </div>

            <div class="timer-card">
                <div class="timer" id="work-timer-box">
                    <span id="work-timer-label">💼 Jornada</span>
                    <p id="work-timer">00:00:00</p>
                </div>
                <!-- Separador -->
                <div class="timer-separator"></div>
                <div class="timer" id="pause-timer-box">
                    <span id="pause-timer-label">☕ Pausa</span>
                    <p id="pause-timer">00:00:00</p>
                </div>
            </div>
            
            <!-- Banner d'Alarma Activa amb Botó per Aturar el Timbre -->
            <div id="alarm-banner" class="alarm-banner" style="display: none;">
                <div class="alarm-banner-content">
                    <span class="alarm-banner-icon">🚨</span>
                    <div class="alarm-banner-text">
                        <strong>TEMPS DE PAUSA COMPLETAT!</strong>
                        <span id="alarm-banner-sub">L'alarma està sonant</span>
                    </div>
                </div>
                <button id="btn-stop-alarm-banner" class="btn-stop-alarm" type="button">
                    🔕 Aturar Alarma
                </button>
            </div>

            <div id="info-message" class="info-message"></div>
        </main>
        
        <div id="button-container" class="button-container">
            <!-- Botones dinámicos se insertarán aquí -->
        </div>

        <div class="log-card">
            <div class="log-card-header">
                <div class="terminal-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <h3>Registre d'Activitat</h3>
                <span class="log-live-badge">LIVE</span>
            </div>
            <div id="log-container"></div>
        </div>
    </div>
    
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Connectant...</p>
    </div>

    <!-- FASE 3: Battery warning indicator -->
    <div id="battery-warning" class="battery-warning">
        Bateria baixa (<span id="battery-level"></span>%) - Connecta el carregador
    </div>

    <!-- Audio player per a fons / alarma persistent -->
    <audio id="pause-audio-player" preload="auto" playsinline style="display:none;"></audio>
</body>
</html>
